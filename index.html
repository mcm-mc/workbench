<style>
/* Layout: one narrow column like a crafting table: bar, tabs, a single working panel, pinned export strip.
   Palette: stone neutrals with a green bias, redstone as the one accent. */
:root {
  --bg: #e6e9e3; --panel: #f4f5f1; --ink: #1b221d; --mute: #59635c; --line: #c6ccc3;
  --accent: #b5382a; --accent-ink: #ffffff; --ok: #2d7a47; --warn: #9a6208; --err: #b3261e;
  --slot: #d2d7cf; --slot-hi: #f8f9f5; --slot-lo: #98a198; --field: #fbfcf9;
  --f-display: "Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151916; --panel: #1e2320; --ink: #e3e8e1; --mute: #97a29a; --line: #333b36;
  --accent: #e8695a; --accent-ink: #1c0f0d; --ok: #6cc184; --warn: #e0a646; --err: #f08a80;
  --slot: #2a302c; --slot-hi: #3b433d; --slot-lo: #0e110f; --field: #181c19; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151916; --panel: #1e2320; --ink: #e3e8e1; --mute: #97a29a; --line: #333b36;
  --accent: #e8695a; --accent-ink: #1c0f0d; --ok: #6cc184; --warn: #e0a646; --err: #f08a80;
  --slot: #2a302c; --slot-hi: #3b433d; --slot-lo: #0e110f; --field: #181c19; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--f-body); padding-block: 20px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#app { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1.1; letter-spacing: .01em; }
h2 { font-size: 18px; margin-top: 10px; }
h3 { font-size: 14px; color: var(--mute); text-transform: uppercase; letter-spacing: .06em; margin-top: 12px; }
small { display: block; color: var(--mute); font-size: 12px; line-height: 1.4; }
code, .mono { font-family: var(--f-mono); font-size: 12.5px; }
code { background: var(--slot); padding: 1px 5px; }
.lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--mute); font-family: var(--f-mono); }
.note { color: var(--mute); font-size: 13px; margin: 0; max-width: 62ch; }
.empty { color: var(--mute); margin: 8px 0; }

.hero { display: flex; flex-direction: column; gap: 16px; padding-top: 8px; }
.lead { font-size: 16px; margin: 0; max-width: 56ch; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 60ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.status { min-height: 1.4em; margin: 0; font-size: 14px; color: var(--mute); }
.status[data-kind="err"] { color: var(--err); }

button, .filebtn { font: 500 14px var(--f-body); min-height: 44px; padding: 0 16px; border: 2px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-align: center; }
button:hover { border-color: var(--mute); }
button:focus-visible, input:focus-visible, select:focus-visible, .filebtn:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.primary:hover { filter: brightness(1.08); border-color: var(--accent); }
.primary:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.ghost { background: transparent; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.bar-name { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bar-name strong { font: 600 20px/1.2 var(--f-display); overflow-wrap: anywhere; }
.pill { display: inline-block; font-size: 12px; padding: 1px 8px; border: 1px solid currentColor; width: fit-content; }
.pill.warn { color: var(--warn); }

.tabs { display: flex; border-bottom: 2px solid var(--line); }
.tabs button { flex: 1; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px; background: transparent; font: 600 15px var(--f-display); letter-spacing: .02em; }
.tabs button[aria-selected="true"] { border-bottom-color: var(--accent); }

.panel { background: var(--panel); border: 2px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fld > span { font-size: 13px; font-weight: 500; }
input[type="text"], input[type="number"], input[type="search"], select { font: 400 15px var(--f-body); min-height: 44px; padding: 0 10px; width: 100%; border: 2px solid var(--line); background: var(--field); color: var(--ink); border-radius: 0; }
.row.sw { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row.sw.big { border: 2px solid var(--line); padding: 10px 12px; background: var(--field); }
.row.sw input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); column-gap: 24px; }

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { min-height: 38px; padding: 0 12px; font-size: 13.5px; white-space: nowrap; }
.chip[aria-pressed="true"], .chip.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg button { flex: 1; min-width: 80px; margin-left: -2px; }
.seg button:first-child { margin-left: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); position: relative; }
.key { margin: 0; color: var(--mute); overflow-wrap: anywhere; }

.slots { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
.slots.armor { grid-template-columns: repeat(4, minmax(0, 56px)); }
.slots.off { grid-template-columns: minmax(0, 56px); }
.slot { aspect-ratio: 1; min-height: 0; padding: 0; position: relative; background: var(--slot); border: 3px solid; border-color: var(--slot-lo) var(--slot-hi) var(--slot-hi) var(--slot-lo); }
.slot:hover { border-color: var(--slot-lo) var(--slot-hi) var(--slot-hi) var(--slot-lo); filter: brightness(1.06); }
.slot.sel { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 1; }
.slot b { font: 700 11px var(--f-mono); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: hsl(var(--h) 38% 42%); color: #fff; text-transform: uppercase; }
.slot i { position: absolute; right: 1px; bottom: 0; font: 600 10px var(--f-mono); color: #fff; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; font-style: normal; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.items li { border-bottom: 1px solid var(--line); }
.items li button { width: 100%; justify-content: flex-start; gap: 12px; border: 0; background: transparent; padding: 0 4px; min-height: 40px; text-align: left; }
.items li button span:nth-child(2) { flex: 1; text-transform: capitalize; }
.items li button .mono { color: var(--mute); width: 64px; flex: none; }
.items li button.sel { background: var(--slot); }
.editor { border: 2px solid var(--accent); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--field); }
.ed-h { display: flex; justify-content: space-between; align-items: baseline; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.sugg:empty { display: none; }

.custom { display: flex; gap: 8px; }
.custom input { flex: 1; min-width: 0; }
.cart { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cart li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cart li > span { text-transform: capitalize; min-width: 0; overflow-wrap: anywhere; }
.qty { display: flex; align-items: center; gap: 4px; flex: none; }
.qty button { min-height: 40px; width: 40px; padding: 0; }
.qty input { width: 64px; text-align: center; min-height: 40px; padding: 0 4px; }
.qty .x { border-color: transparent; color: var(--mute); }
.way { border-top: 2px solid var(--line); padding-top: 4px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.way > * { max-width: 100%; }
.cmds { font: 400 12.5px/1.6 var(--f-mono); background: var(--field); border: 2px solid var(--line); padding: 10px; margin: 0; width: 100%; overflow-x: auto; white-space: pre; max-height: 220px; }

.export { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 2px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); z-index: 5; }
.export > div { display: flex; align-items: baseline; gap: 8px; }
.export strong { font: 700 22px var(--f-display); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); max-width: min(520px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 10px 16px; z-index: 9; font-size: 14px; }
#toast[data-kind="err"] { background: var(--err); color: #fff; }
#toast[data-kind="warn"] { background: var(--warn); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .panel { animation: rise .18s ease-out; } @keyframes rise { from { opacity: .4; transform: translateY(4px); } } }
.ic { display: block; width: 100%; height: 100%; text-decoration: none; image-rendering: pixelated; background-image: var(--sheet); background-repeat: no-repeat; background-size: 4800% auto; }
.ic.ph { background: var(--slot); display: flex; align-items: center; justify-content: center; font: 700 11px var(--f-mono); color: var(--mute); text-transform: uppercase; }
.en em { font-style: normal; font-size: 11px; color: var(--ok); margin-left: 6px; }
.en.rec span { font-weight: 600; }
.en-h { margin: 10px 0 2px; font: 600 13px var(--f-display); color: var(--mute); }
.more > summary { cursor: pointer; padding: 8px 0; font-size: 13px; color: var(--mute); }
.ic.sm { width: 28px; height: 28px; flex: none; }
.ic.xs { width: 20px; height: 20px; margin-right: 6px; flex: none; }
.slot .ic { position: absolute; inset: 0; padding: 1px; }
.slot.ench::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, #b78cff44, #7a3ad644); box-shadow: inset 0 0 0 1px #b78cff; pointer-events: none; }
.slot i { z-index: 2; }
.items li button { gap: 10px; }
.items li button em { color: #8a56d8; font-style: normal; font-size: 12px; }
.gridi { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.it { flex-direction: column; justify-content: flex-start; gap: 4px; min-height: 76px; padding: 6px 4px; font-size: 12px; line-height: 1.25; text-transform: capitalize; overflow-wrap: anywhere; min-width: 0; }
.it .ic { width: 32px; height: 32px; flex: none; }
.it.on { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.sm { min-height: 36px; padding: 0 12px; font-size: 13px; }
.ib-state { flex: 1; min-width: 160px; font-size: 13px; color: var(--mute); }
.ach { border: 2px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--field); }
.ach.off { border-color: var(--warn); }
.ach.on { border-color: var(--ok); }
.ach-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.pill.ok { color: var(--ok); }
.ach-l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 14px; }
.ach-l li { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.ach-l li.bad b { color: var(--warn); }
.ench { border-top: 1px solid var(--line); padding-top: 8px; }
.ench summary { cursor: pointer; min-height: 40px; display: flex; align-items: center; gap: 8px; font-weight: 600; }
.actions.tight { gap: 6px; margin: 4px 0 8px; }
.en-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 14px; }
.en { display: grid; grid-template-columns: 24px 1fr 64px; align-items: center; gap: 8px; min-height: 40px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.en.on span { font-weight: 600; color: var(--accent); }
.en input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); }
.en input[type="number"] { min-height: 34px; padding: 0 4px; text-align: center; }
.cart li .ic { margin-right: 4px; }
.cart li > span { flex: 1; }
.filebtn.sm { cursor: pointer; }
.grp { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
.gh { justify-content: space-between; width: 100%; border: 0; background: transparent; font: 600 15px var(--f-display); padding: 0 2px; }
.gh::before { content: "▸"; margin-right: 8px; color: var(--accent); transition: transform .12s; }
.gh[aria-expanded="true"]::before { transform: rotate(90deg); }
.gh > span:first-child { flex: 1; text-align: left; }
.gridi { grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); }

.en-eng { display: block; font-size: 10.5px; font-weight: 400; color: var(--mute); line-height: 1.2; }
.en.on .en-eng { color: var(--mute); }

.ench > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 48px; padding: 0 12px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; }
.ench > summary::-webkit-details-marker { display: none; }

.ench[open] > summary { margin-bottom: 10px; border-color: var(--accent); }

/* ---------- byte helpers ---------- */
const TD = new TextDecoder(), TE = new TextEncoder();
function cat(parts) {
  let n = 0; for (const p of parts) n += p.length;
  const o = new Uint8Array(n); let i = 0;
  for (const p of parts) { o.set(p, i); i += p.length; }
  return o;
}
function rdVar(b, p) {
  let r = 0, s = 1, x;
  do { x = b[p.i++]; r += (x & 127) * s; s *= 128; } while (x & 128);
  return r;
}
function wrVar(arr, v) {
  while (v >= 128) { arr.push((v % 128) | 128); v = Math.floor(v / 128); }
  arr.push(v);
}
function cmpBytes(a, b) {
  const n = Math.min(a.length, b.length);
  for (let i = 0; i < n; i++) if (a[i] !== b[i]) return a[i] - b[i];
  return a.length - b.length;
}
function hex(b) { let s = ''; for (const x of b) s += (x < 16 ? '0' : '') + x.toString(16); return s; }
function strBytes(s) { return TE.encode(s); }

/* ---------- crc32c (leveldb log checksum) ---------- */

async function loadFile(file) {
  const st = $('#status'); st.textContent = 'กำลังอ่านไฟล์…'; st.dataset.kind = '';
  try {
    const buf = new Uint8Array(await file.arrayBuffer());
    const ents = zipRead(buf);
    const cur = ents.find(e => /(^|\/)db\/CURRENT$/.test(e.name));
    if (!cur) throw new Error('ไม่พบโฟลเดอร์ db ในไฟล์นี้ ต้องเป็น zip ของโฟลเดอร์เวิลด์ Minecraft Bedrock');
    const prefix = cur.name.slice(0, cur.name.length - 'db/CURRENT'.length);
    const byName = new Map(ents.map(e => [e.name, e]));
    const lv = byName.get(prefix + 'level.dat');
    if (!lv) throw new Error('ไม่พบ level.dat');
    const lvBytes = await zipData(buf, lv);
    const level = levelRead(lvBytes);
    const dbNames = ents.filter(e => e.name.startsWith(prefix + 'db/') && !e.name.endsWith('/')).map(e => e.name.slice((prefix + 'db/').length));
    st.textContent = 'กำลังค้นหาข้อมูลผู้เล่นในฐานข้อมูล…';
    const getF = async n => zipData(buf, byName.get(prefix + 'db/' + n));
    const min = strBytes('player');
    const r = await dbScan(dbNames, getF, min, k => { const s = TD.decode(k); return s === '~local_player' || s.startsWith('player_'); });
    const players = [];
    for (const e of r.entries) {
      try {
        const { root, end } = nbtRead(e.value);
        if (!nget(root, 'Inventory') && !nget(root, 'Pos')) continue;
        players.push({ key: TD.decode(e.key), root, tail: e.value.slice(end) });
      } catch { /* skip */ }
    }
    players.sort((a, b) => (a.key === '~local_player' ? -1 : b.key === '~local_player' ? 1 : a.key.localeCompare(b.key)));
    Object.assign(S, { loaded: true, demo: false, fileName: file.name, zipBuf: buf, ents, prefix, levelVersion: level.version, level: level.root, players, db: r,
      dirtyPlayers: new Set(), levelDirty: false, pi: 0, sel: null, tab: 'world' });
    S.originalName = nget(level.root, 'LevelName')?.v || '';
    st.textContent = '';
    render();
    toast('เปิดแล้ว: พบผู้เล่น ' + players.length + ' คน');
  } catch (e) { st.textContent = e.message || String(e); st.dataset.kind = 'err'; }
}

const SECS = { inv: ['Inventory', 36, 'ช่องเก็บของ'], ender: ['EnderChestInventory', 27, 'เอนเดอร์เชสต์'], armor: ['Armor', 4, 'เกราะ'], off: ['Offhand', 1, 'มือรอง'] };
function secList(p, sec) {
  const [name, n] = SECS[sec];
  let l = nget(p.root, name);
  if (!l) { l = nset(p.root, name, 9, [], { et: 10 }); }
  if (l.et === 0) l.et = 10;
  return l;
}
function slotEntry(list, slot) { return list.v.find((it, i) => { const s = nget(it, 'Slot'); return (s ? s.v : i) === slot; }); }
function itemInfo(it) {
  if (!it) return null;
  const name = nget(it, 'Name')?.v || ''; const count = nget(it, 'Count')?.v || 0;
  if (!name || count <= 0) return null;
  return { name, count, damage: nget(it, 'Damage')?.v || 0 };
}
function readEnch(item) {
  const m = {}; const l = item && nget(item, 'tag') && nget(nget(item, 'tag'), 'ench');
  if (l) for (const e of l.v) { const id = nget(e, 'id')?.v, lv = nget(e, 'lvl')?.v; if (id != null) m[id] = lv; }
  return m;
}
function applyEnch(item, map) {
  let tag = nget(item, 'tag'); const ids = Object.keys(map).map(Number).sort((a, b) => a - b);
  if (!ids.length) { if (tag) { tag.v = tag.v.filter(e => e[0] !== 'ench'); if (!tag.v.length) item.v = item.v.filter(e => e[0] !== 'tag'); } return; }
  if (!tag) tag = nset(item, 'tag', 10, []);
  const list = nL(10, ids.map(i => nC([['id', nH(i)], ['lvl', nH(map[i])]])));
  const ex = tag.v.find(e => e[0] === 'ench'); if (ex) ex[1] = list; else tag.v.push(['ench', list]);
}
function setSlot(p, sec, slot, id, count, damage, ench) {
  const list = secList(p, sec);
  const idx = list.v.findIndex((it, i) => { const s = nget(it, 'Slot'); return (s ? s.v : i) === slot; });
  const old = idx >= 0 ? list.v[idx] : null;
  let nn;
  if (!id) nn = mkEmpty(slot);
  else if (old && nget(old, 'Name')?.v === id) { nn = old; nset(nn, 'Count', 1, count); nset(nn, 'Damage', 2, damage); }
  else nn = mkItem(id, count, slot, damage);
  if (id && ench) applyEnch(nn, ench);
  if (idx >= 0) list.v[idx] = nn; else { list.v.push(nn); list.v.sort((a, b) => (nget(a, 'Slot')?.v ?? 0) - (nget(b, 'Slot')?.v ?? 0)); }
  S.dirtyPlayers.add(p.key);
}
function stacksFor(id, count) { const m = maxStack(id); const out = []; while (count > 0) { const c = Math.min(m, count); out.push(c); count -= c; } return out; }
function giveToPlayer(p) {
  const list = secList(p, 'inv'); let placed = 0, lost = 0;
  for (const [id, count] of S.give) {
    for (const c of stacksFor(id, count)) {
      let slot = -1;
      for (let s = 0; s < 36; s++) if (!itemInfo(slotEntry(list, s))) { slot = s; break; }
      if (slot < 0) { lost += c; continue; }
      const en = S.givePreset === 'compat' ? enchMapCompat(id) : S.givePreset === 'all' ? enchMapAll() : undefined;
      setSlot(p, 'inv', slot, id, c, 0, en); placed += c;
    }
  }
  return { placed, lost };
}

  return `<div class="fld"><span>ช่องนี้ใส่ได้เฉพาะ: ${ARMOR_LABEL[S.sel] || 'เกราะ'}</span><div class="gridi">${ids.map(i => `<button type="button" class="it ${cur && cur.name === 'minecraft:' + i ? 'on' : ''}" data-pick="${i}" title="${esc(nice(i))}">${icon(i, 'ic')}<span>${esc(nice(i))}</span></button>`).join('')}</div></div><div class="sugg" id="sugg"></div>`;
}
function playersTab() {
  if (!S.players.length) return '<p class="empty">ไม่พบข้อมูลผู้เล่นในเวิลด์นี้ ลองเข้าเล่นเวิลด์สักครั้งก่อนแล้วบีบอัดใหม่</p>';
  const p = S.players[Math.min(S.pi, S.players.length - 1)];
  const label = k => k === '~local_player' ? 'ผู้เล่นหลัก' : 'ผู้เล่น …' + k.slice(-6);
  const pos = posOf(p); const dim = nget(p.root, 'DimensionId')?.v;
  const [secName, size] = SECS[S.sec];
  const list = secList(p, S.sec);
  let cells = '';
  for (let s = 0; s < size; s++) {
    const raw = slotEntry(list, s); const it = itemInfo(raw);
    const sel = S.sel === s ? ' sel' : '';
    const en = it && Object.keys(readEnch(raw)).length ? ' ench' : '';
    cells += it ? `<button class="slot${sel}${en}" data-slot="${s}" title="${esc(nice(it.name))}">${icon(it.name, 'ic')}<i>${it.count > 1 ? it.count : ''}</i></button>`
      : `<button class="slot empty${sel}" data-slot="${s}" aria-label="ช่องว่าง ${s + 1}"></button>`;
  }
  const rows = [];
  for (let s = 0; s < size; s++) { const raw = slotEntry(list, s); const it = itemInfo(raw); if (it) { const en = Object.keys(readEnch(raw)).length; rows.push(`<li><button data-slot="${s}" class="${S.sel === s ? 'sel' : ''}">${icon(it.name, 'ic sm')}<span class="mono">${S.sec === 'inv' ? (s < 9 ? 'แถบ ' + (s + 1) : 'ช่อง ' + (s + 1)) : 'ช่อง ' + (s + 1)}</span><span>${esc(nice(it.name))}${en ? ' <em>✦' + en + '</em>' : ''}</span><b>×${it.count}</b></button></li>`); } }
  let editor = '';
  if (S.sel != null) {
    const cur = itemInfo(slotEntry(list, S.sel));
    editor = `<form class="editor" id="ed" autocomplete="off">
      <div class="ed-h"><strong>ช่อง ${S.sel + 1}</strong><span class="lbl">${esc(SECS[S.sec][2])}</span></div>
      <label class="fld"><span>ไอเทม (id)</span><input id="ed-id" type="text" inputmode="url" autocapitalize="none" spellcheck="false" value="${esc(cur ? cur.name : '')}" placeholder="เช่น diamond หรือ minecraft:diamond"></label>
      ${S.sec === 'armor' ? armorPicker(cur) : '<div class="sugg" id="sugg"></div>'}
      <div class="grid2">
        <label class="fld"><span>จำนวน</span><input id="ed-n" type="number" min="1" max="${S.sec === 'armor' ? 1 : 64}" value="${cur ? cur.count : 1}"></label>
        <label class="fld"><span>ค่า damage/ข้อมูล</span><input id="ed-d" type="number" min="0" max="32767" value="${cur ? cur.damage : 0}"></label>
      </div>
      ${enchEditor(cur ? cur.name : '')}
      <div class="actions"><button class="primary" type="submit">ใส่ในช่องนี้</button><button class="ghost" type="button" data-act="clear">ล้างช่อง</button></div>
    </form>`;
  }
  return `
  <div class="chips">${S.players.map((q, i) => `<button class="chip" aria-pressed="${i === S.pi}" data-pi="${i}">${esc(label(q.key))}</button>`).join('')}</div>
  <p class="mono key">${esc(p.key)}</p>
  ${pos ? `<div class="grid3">${['X', 'Y', 'Z'].map((a, i) => `<label class="fld"><span>ตำแหน่ง ${a}</span><input type="number" step="0.5" data-pos="${i}" value="${Math.round(pos[i] * 100) / 100}"></label>`).join('')}</div><p class="note">มิติ: ${DIMS[dim] ?? '–'}</p>` : ''}
  <div class="seg">${Object.entries(SECS).map(([k, v]) => `<button data-sec="${k}" aria-pressed="${S.sec === k}">${v[2]}</button>`).join('')}</div>
  <div class="slots ${S.sec}">${cells}</div>
  ${editor}
  <ul class="items">${rows.join('') || '<li class="empty">ไม่มีไอเทมในส่วนนี้ กดช่องว่างเพื่อใส่ของ</li>'}</ul>
  <p class="note">ไอเทมที่ใส่ใหม่ไม่มีข้อมูลบล็อกพิเศษ บล็อกบางชนิดอาจต้องตรวจในเกมว่าขึ้นถูก ถ้าไม่ขึ้นให้ใช้แท็บ เสกของ แบบคำสั่งแทน</p>`;
}
function giveTab() {
  const q = S.filter.trim().toLowerCase().replace(/\s+/g, '_');
  const groups = Object.entries(CATALOG).map(([g, ids]) => [g, ids]);
  const html = groups.map(([g, ids]) => {
    const m = q ? ids.filter(i => i.includes(q)) : ids; if (!m.length) return '';
    const open = q ? true : S.open.has(g); const cap = S.cap[g] || 120; const shown = open ? m.slice(0, cap) : [];
    return `<div class="grp"><button class="gh" data-grp="${esc(g)}" aria-expanded="${open}"><span>${esc(g)}</span><span class="lbl">${m.length}</span></button>${open ? `<div class="gridi">${shown.map(i => `<button class="it ${S.give.has('minecraft:' + i) ? 'on' : ''}" data-add="${i}" title="${esc(nice(i))}">${icon(i, 'ic')}<span>${esc(nice(i))}</span></button>`).join('')}</div>${m.length > shown.length ? `<button class="ghost sm" data-more="${esc(g)}">ดูเพิ่ม (${m.length - shown.length})</button>` : ''}` : ''}</div>`;
  }).join('');
  const sel = [...S.give.entries()];
  const cmds = sel.flatMap(([id, c]) => stacksFor(id, c).map(n => `/give @s ${id} ${n}`));
  const p = S.players[S.pi];
  return `
  <label class="fld"><span>ค้นหาไอเทม <small>(${ITEM_IDS.length} รายการในรายการ)</small></span><input id="f-q" type="search" value="${esc(S.filter)}" placeholder="เช่น diamond, golden, ender"></label>
  <div class="custom"><input id="f-custom" type="text" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="id อื่นๆ เช่น minecraft:elytra"><button class="ghost" data-act="addcustom">เพิ่ม id นี้</button></div>
  <div class="cat">${html || '<p class="empty">ไม่พบไอเทมที่ค้นหา ลองพิมพ์ id เองด้านบน</p>'}</div>
  <h2>รายการที่จะเสก</h2>
  ${sel.length ? `<ul class="cart">${sel.map(([id, c]) => `<li>${icon(id, 'ic sm')}<span>${esc(nice(id))}</span><div class="qty"><button data-q="${esc(id)}" data-d="-1" aria-label="ลด">−</button><input type="number" min="1" max="2304" value="${c}" data-qi="${esc(id)}"><button data-q="${esc(id)}" data-d="1" aria-label="เพิ่ม">+</button><button class="x" data-rm="${esc(id)}" aria-label="เอาออก">✕</button></div></li>`).join('')}</ul>` : '<p class="empty">แตะไอเทมด้านบนเพื่อเพิ่มลงรายการ</p>'}
  ${sel.length ? `
  <div class="way">
    <h3>วิธีที่ 1 ใส่เข้าช่องเก็บของโดยตรง</h3>
    <label class="fld"><span>เอนชานต์ให้ของที่ใส่</span><select id="f-preset"><option value="none" ${S.givePreset === 'none' ? 'selected' : ''}>ไม่ใส่เอนชานต์</option><option value="compat" ${S.givePreset === 'compat' ? 'selected' : ''}>เต็มตามประเภทไอเทม (เฉพาะที่เข้ากัน)</option><option value="all" ${S.givePreset === 'all' ? 'selected' : ''}>ทุกเอนชานต์เต็มทุกชิ้น</option></select></label>
    <p class="note">${p ? 'ผู้เล่นที่เลือก: <b>' + esc(p.key) + '</b>' : 'ไม่พบผู้เล่น'} ของจะลงช่องว่างในช่องเก็บของ (ถ้าเต็มจะข้าม)</p>
    <button class="primary" data-act="giveinv" ${p ? '' : 'disabled'}>ใส่ลงช่องเก็บของ</button>
  </div>
  <div class="way">
    <h3>วิธีที่ 2 ชุดคำสั่งในเวิลด์</h3>
    <label class="row sw"><span>ฝังชุดคำสั่งในเวิลด์ที่ส่งออก<small>พิมพ์ /function workbench_kit ในเกมเพื่อรับของทั้งหมด ต้องเปิดโหมดโกง ซึ่งปิดความสำเร็จ และคำสั่งไม่ใส่เอนชานต์ให้</small></span><input id="f-pack" type="checkbox" ${S.addPack ? 'checked' : ''}></label>
    <pre class="cmds" id="cmds">${esc(cmds.join('\n'))}</pre>
    <button class="ghost" data-act="copycmds">คัดลอกคำสั่ง</button>
  </div>` : ''}`;
}

/* ---------- events ---------- */
function setEnchDom(map) {
  S.edEnch = { ...map };
  document.querySelectorAll('[data-ench]').forEach(c => { const id = +c.dataset.ench; const on = map[id] != null; c.checked = on; c.closest('.en').classList.toggle('on', on); const l = document.querySelector(`[data-lvl="${id}"]`); l.value = on ? map[id] : ENCH_MAX[id]; });
  const n = $('#en-n'); if (n) n.textContent = Object.keys(map).length;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; S.sel = null; render(); return; }
  if (b.dataset.pi != null) { S.pi = +b.dataset.pi; S.sel = null; render(); return; }
  if (b.dataset.sec) { S.sec = b.dataset.sec; S.sel = null; render(); return; }
  if (b.dataset.slot != null) {
    S.sel = +b.dataset.slot; const p = S.players[S.pi]; S.edEnch = readEnch(slotEntry(secList(p, S.sec), S.sel)); render();
    const ed = $('#ed'); if (ed) ed.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return;
  }
  if (b.dataset.grp) { const g = b.dataset.grp; if (S.open.has(g)) S.open.delete(g); else S.open.add(g); render(); return; }
  if (b.dataset.more) { S.cap[b.dataset.more] = (S.cap[b.dataset.more] || 120) + 120; render(); return; }
  if (b.dataset.add) { const id = 'minecraft:' + b.dataset.add; if (S.give.has(id)) S.give.delete(id); else S.give.set(id, maxStack(id) === 1 ? 1 : 16); render(); return; }
  if (b.dataset.q) { const id = b.dataset.q; S.give.set(id, Math.max(1, Math.min(2304, (S.give.get(id) || 1) + (+b.dataset.d) * (maxStack(id) === 1 ? 1 : 8)))); render(); return; }
  if (b.dataset.rm) { S.give.delete(b.dataset.rm); render(); return; }
  if (b.dataset.pick) { const inp = $('#ed-id'); inp.value = 'minecraft:' + b.dataset.pick; refreshEnchRows(); document.querySelectorAll('[data-pick]').forEach(x => x.classList.toggle('on', x === b)); return; }
  if (b.dataset.sug) { $('#ed-id').value = b.dataset.sug; $('#sugg').innerHTML = ''; refreshEnchRows(); return; }
  const act = b.dataset.act; if (!act) return;
  if (act === 'demo') loadDemo();
  else if (act === 'close') { S.loaded = false; S.zipBuf = null; S.give.clear(); render(); }
  else if (act === 'clear') { const p = S.players[S.pi]; setSlot(p, S.sec, S.sel, '', 0, 0); S.sel = null; render(); }
  else if (act === 'en-none') setEnchDom({});
  else if (act === 'en-compat') setEnchDom(enchMapCompat(normId($('#ed-id').value)));
  else if (act === 'en-all') setEnchDom(enchMapAll());
  else if (act === 'achon') {
    const L = S.level;
    for (const k of ['commandsEnabled', 'cheatsEnabled', 'hasBeenLoadedInCreative']) { const n = nget(L, k); if (n && n.v) nset(L, k, 1, 0); }
    const exp = nget(L, 'experiments'); if (exp) for (const k of ['experiments_ever_used', 'saved_with_toggled_experiments']) { const n = nget(exp, k); if (n && n.v) nset(exp, k, 1, 0); }
    S.levelDirty = true; render(); toast('ล้างแฟลกที่ปิดความสำเร็จแล้ว ส่งออกเพื่อบันทึก');
  }
  else if (act === 'addcustom') { const v = normId($('#f-custom').value); if (!validId(v)) return toast('id ไม่ถูกต้อง ใช้ตัวพิมพ์เล็ก ตัวเลข และ _ เท่านั้น', 'err'); S.give.set(v, maxStack(v) === 1 ? 1 : 16); render(); }
  else if (act === 'giveinv') { const p = S.players[S.pi]; const r = giveToPlayer(p); render(); toast(r.lost ? `ใส่แล้ว ${r.placed} ชิ้น ช่องเต็ม ข้ามไป ${r.lost} ชิ้น` : `ใส่ลงช่องเก็บของแล้ว ${r.placed} ชิ้น`, r.lost ? 'warn' : ''); }
  else if (act === 'copycmds') { const t = $('#cmds').textContent; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('คัดลอกแล้ว')).catch(() => { const r = document.createRange(); r.selectNodeContents($('#cmds')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('เลือกข้อความให้แล้ว กดคัดลอกเอง'); }); }
  else if (act === 'export') exportWorld();
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file' && t.files[0]) return loadFile(t.files[0]);
  if (t.dataset.ench != null) { const id = +t.dataset.ench; const lv = document.querySelector(`[data-lvl="${id}"]`); if (t.checked) S.edEnch[id] = Math.max(1, Math.min(255, Math.round(+lv.value) || ENCH_MAX[id])); else delete S.edEnch[id]; t.closest('.en').classList.toggle('on', t.checked); const n = $('#en-n'); if (n) n.textContent = Object.keys(S.edEnch).length; return; }
  if (t.dataset.lvl != null) { const id = +t.dataset.lvl; const v = Math.max(1, Math.min(255, Math.round(+t.value) || 1)); t.value = v; if (S.edEnch[id] != null) S.edEnch[id] = v; return; }
  if (!S.loaded) return;
  const L = S.level; const mark = () => { S.levelDirty = true; };
  if (t.id === 'f-name') { nset(L, 'LevelName', 8, t.value); mark(); }
  else if (t.id === 'f-gt') { nset(L, 'GameType', 3, +t.value); mark(); }
  else if (t.id === 'f-df') { nset(L, 'Difficulty', 3, +t.value); mark(); }
  else if (t.id === 'f-cheat') { nset(L, 'commandsEnabled', 1, t.checked ? 1 : 0); mark(); updateExportBar(); render(); return; }
  else if (t.id === 'f-rain') { nset(L, 'raining', 1, t.checked ? 1 : 0); mark(); }
  else if (t.id === 'f-light') { nset(L, 'lightning', 1, t.checked ? 1 : 0); mark(); }
  else if (t.id === 'f-time') { const old = nget(L, 'Time')?.v ?? 0n; const day = BigInt(Math.max(0, Math.min(23999, +t.value || 0))); nset(L, 'Time', 4, old - (old % 24000n) + day); mark(); }
  else if (t.dataset.spawn) { nset(L, t.dataset.spawn, 3, Math.round(+t.value) || 0); mark(); }
  else if (t.dataset.rule) { nset(L, t.dataset.rule, 1, t.checked ? 1 : 0); mark(); }
  else if (t.dataset.pos != null) { const p = S.players[S.pi]; const l = nget(p.root, 'Pos'); l.v[+t.dataset.pos] = nF(+t.value || 0); S.dirtyPlayers.add(p.key); }
  else if (t.dataset.qi) { S.give.set(t.dataset.qi, Math.max(1, Math.min(2304, Math.round(+t.value) || 1))); }
  else if (t.id === 'f-pack') { S.addPack = t.checked; }
  else if (t.id === 'f-preset') { S.givePreset = t.value; }
  else return;
  updateExportBar();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'f-q') { S.filter = t.value; const pos = t.selectionStart; render(); const n = $('#f-q'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }
  else if (t.id === 'ed-id') {
    const q = t.value.trim().toLowerCase().replace(/^minecraft:/, '').replace(/\s+/g, '_');
    const m = q ? ITEM_IDS.filter(i => i.includes(q) && (S.sec !== 'armor' || armorOk(S.sel, i))).slice(0, 8) : [];
    $('#sugg').innerHTML = m.map(i => `<button type="button" class="chip" data-sug="minecraft:${i}">${icon(i, 'ic xs')}${esc(nice(i))}</button>`).join('');
    refreshEnchRows();
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'ed') return; e.preventDefault();
  const id = normId($('#ed-id').value);
  if (!validId(id) || id === 'minecraft:') return toast('id ไม่ถูกต้อง', 'err');
  if (S.sec === 'armor' && !armorOk(S.sel, id)) return toast('ช่องนี้ใส่ได้เฉพาะ: ' + ARMOR_LABEL[S.sel], 'err');
  const n = Math.max(1, Math.min(S.sec === 'armor' ? 1 : 64, Math.round(+$('#ed-n').value) || 1)); const d = Math.max(0, Math.min(32767, Math.round(+$('#ed-d').value) || 0));
  setSlot(S.players[S.pi], S.sec, S.sel, id, n, d, { ...S.edEnch }); S.sel = null; S.edEnch = {}; render(); toast('ใส่แล้ว');
});
function updateExportBar() {
  const n = changeCount(); const bar = $('.export'); if (!bar) return;
  bar.querySelector('strong').textContent = n; bar.querySelector('button').disabled = S.demo || !n;
}

/* ---------- export ---------- */
function packFiles() {
  const lines = []; for (const [id, c] of S.give) for (const n of stacksFor(id, c)) lines.push(`give @s ${id} ${n}`);
  const uuid = () => crypto.randomUUID();
  const manifest = { format_version: 2, header: { name: 'World Workbench Kit', description: 'รันด้วย /function workbench_kit', uuid: uuid(), version: [1, 0, 0], min_engine_version: [1, 20, 0] }, modules: [{ type: 'data', uuid: uuid(), version: [1, 0, 0] }] };
  return { manifest, fn: lines.join('\n') + '\n' };
}
async function exportWorld() {
  if (S.demo) return;
  const btn = $('.export button'); btn.disabled = true; const old = btn.textContent; btn.textContent = 'กำลังสร้างไฟล์…';
  try {
    const now = dosNow(); const { zipBuf: buf, ents, prefix } = S;
    const replace = new Map(); // name -> Uint8Array (new content)
    if (S.levelDirty) {
      replace.set(prefix + 'level.dat', levelWrite(S.levelVersion, S.level));
      const nm = nget(S.level, 'LevelName')?.v; if (nm && nm !== S.originalName) replace.set(prefix + 'levelname.txt', TE.encode(nm));
    }
    if (S.dirtyPlayers.size || (S.addPack && S.give.size)) {
      const puts = [];
      for (const p of S.players) if (S.dirtyPlayers.has(p.key)) puts.push({ key: strBytes(p.key), value: cat([nbtWrite(p.root), p.tail]) });
      if (puts.length) {
        const batch = buildBatch(S.db.maxSeq + 1, puts);
        replace.set(prefix + 'db/' + String(S.db.nextFile).padStart(6, '0') + '.log', buildLogFile(batch));
      }
    }
    const extra = new Map();
    if (S.addPack && S.give.size) {
      const { manifest, fn } = packFiles();
      const dir = prefix + 'behavior_packs/workbench_kit/';
      extra.set(dir + 'manifest.json', TE.encode(JSON.stringify(manifest, null, 2)));
      extra.set(dir + 'functions/workbench_kit.mcfunction', TE.encode(fn));
      let packs = [];
      const wp = ents.find(e => e.name === prefix + 'world_behavior_packs.json');
      if (wp) { try { packs = JSON.parse(TD.decode(await zipData(buf, wp))); } catch { packs = []; } }
      packs = packs.filter(x => x.pack_id !== manifest.header.uuid);
      packs.push({ pack_id: manifest.header.uuid, version: [1, 0, 0] });
      replace.set(prefix + 'world_behavior_packs.json', TE.encode(JSON.stringify(packs)));
    }
    const parts = [];
    for (const e of ents) {
      if (replace.has(e.name)) continue;
      parts.push({ name: e.name, method: e.method, crc: e.crc, csize: e.csize, usize: e.usize, time: e.time, date: e.date, data: zipRaw(buf, e) });
    }
    for (const [name, data] of [...replace, ...extra]) {
      const c = await deflateRaw(data);
      parts.push({ name, method: 8, crc: crc32(data), csize: c.length, usize: data.length, time: now.time, date: now.date, data: c });
    }
    const blob = new Blob(zipWrite(parts), { type: 'application/zip' });
    const base = (S.fileName || 'world').replace(/\.(zip|mcworld)$/i, '');
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = base + '-edited.mcworld'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    toast('บันทึกไฟล์ .mcworld แล้ว เปิดไฟล์นั้นเพื่อนำเข้า Minecraft');
  } catch (e) {
    if (e && e.code === 'declined') toast('ยกเลิกการบันทึก'); else toast('ส่งออกไม่สำเร็จ: ' + (e.message || e.code || e), 'err');
  } finally { btn.textContent = old; updateExportBar(); }
}

render();

</script>
